name: Build InputredirectionForMac

on:
  workflow_dispatch:
  push:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create App Bundle
        run: |
          mkdir -p build/InputredirectionForMac.app/Contents/MacOS
          mkdir -p build/InputredirectionForMac.app/Contents/Resources

      - name: Build macOS Application
        run: |
          swiftc \
          -target x86_64-apple-macos11 \
          -framework Cocoa \
          -framework GameController \
          -framework AVFoundation \
          main.swift \
          -o build/InputredirectionForMac.app/Contents/MacOS/InputredirectionForMac

      - name: Create Info.plist
        run: |
          cat > build/InputredirectionForMac.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>CFBundleExecutable</key>
              <string>InputredirectionForMac</string>

              <key>CFBundleIdentifier</key>
              <string>com.bernas.inputredirection</string>

              <key>CFBundleName</key>
              <string>InputredirectionForMac</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleVersion</key>
              <string>1.0</string>

              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>

              <key>NSHighResolutionCapable</key>
              <true/>

          </dict>
          </plist>
          EOF

      - name: Make Executable
        run: |
          chmod +x build/InputredirectionForMac.app/Contents/MacOS/InputredirectionForMac

      - name: Verify App
        run: |
          ls -R build/

      - name: Create DMG
        run: |
          hdiutil create \
          -volname "InputredirectionForMac" \
          -srcfolder build/InputredirectionForMac.app \
          -ov \
          -format UDZO \
          build/InputredirectionForMac.dmg

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: InputredirectionForMac-app
          path: build/InputredirectionForMac.app

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: InputredirectionForMac-dmg
          path: build/InputredirectionForMac.dmg
